name: MVC CI
on:
  push:
    branches: [main, release, staging, test, dev, features, 'F*', 'feature/**']
  pull_request:
    branches: [dev, test, staging, release, main]
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore MVC.slnx
      - run: dotnet build MVC.slnx --configuration Release --no-restore
      - run: dotnet test MVC.slnx --configuration Release --no-build --logger trx